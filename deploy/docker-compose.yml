# The studio, hosted: the studio and a TLS/auth edge on one small box. The
# harness is Hannes's Modal deployment, reached over HTTPS, so there is no
# harness container here any more and nothing needs Docker-in-Docker.
#
# What the box has to be: a Node host with a persistent disk, reachable from
# the internet on 80/443. The sandbox on Modal fetches each render's workflow
# bundle from THIS server, so STUDIO_ORIGIN must be its public address.
services:
  studio:
    build: ../webui
    image: auteur-studio:local
    container_name: studio
    restart: unless-stopped
    env_file: ./auteur.env             # GROK_API_KEY and the AWS keys (s3presign) live there
    environment:
      HOST: "127.0.0.1"                # only Caddy talks to it
      PORT: "5290"
      BODY_SIZE_LIMIT: "Infinity"      # adapter-node's 512K default would refuse reference images
      ORIGIN: "${STUDIO_ORIGIN}"
      AUTEUR_STUDIO_URL: "${STUDIO_ORIGIN}"
      AUTEUR_MODAL_KEY: "${AUTEUR_MODAL_KEY}"
      AUTEUR_MODAL_SECRET: "${AUTEUR_MODAL_SECRET}"
      AUTEUR_MODAL_WORKSPACE: "${AUTEUR_MODAL_WORKSPACE}"
      AUTEUR_MODAL_APP: "${AUTEUR_MODAL_APP:-auteur-harness-modal}"
      # Deliberately NOT set: AUTEUR_BUNDLE_ABSOLUTE_URL. The Modal harness reads
      # the bundle's relative `url: workflow.json` correctly and mis-joins an
      # absolute one (measured 2026-09-04, a live 404).
    network_mode: host                 # 127.0.0.1:5290 for Caddy, nothing published
    volumes:
      - ./auteur.env:/root/auteur/.env:ro        # s3presign reads AWS keys from $HOME/auteur/.env
      - ./studio-library:/root/auteur/studio-library   # clips, refs, sheets, render log, job book
      - ./studio-tuning:/root/auteur/studio-tuning

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    network_mode: host                 # 80/443 on the host; proxies to 127.0.0.1:5290
    environment:
      STUDIO_HOST: "${STUDIO_HOST}"
      BASIC_AUTH_USER: "${BASIC_AUTH_USER}"
      BASIC_AUTH_HASH: "${BASIC_AUTH_HASH}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
