[project]
name = "refsrag"
version = "0.1.0"
description = "Pose and outfit reference recommender: index build, labelling jobs, query interface"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.27",
    "numpy>=2.0",
    "onnxruntime>=1.19",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pillow>=10.4",
    "pyyaml>=6.0",
    "tokenizers>=0.20",
    "typer>=0.12",
]

[project.scripts]
refs = "refsrag.cli:app"

[dependency-groups]
dev = ["moto[s3]>=5.0", "pytest>=8.3", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "boto3-stubs[s3]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refsrag"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM905"]  # word lists read better as one split string

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["library: needs the real image library at REFS_LIBRARY_ROOT", "live: real network (LIVE_TESTS=1)"]

[tool.mypy]
strict = true
packages = ["refsrag"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*", "tokenizers"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # hand-written fixture data reads better unwrapped
