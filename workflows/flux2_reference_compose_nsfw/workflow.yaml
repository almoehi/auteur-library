# ─── Source ───────────────────────────────────────────────────────────────────
# NSFW variant of flux2_reference_compose: the same graph and ports with the general NSFW LoRA (SNOFS v1.4, 0.7)
# baked into the Power Lora Loader. Generated by flux2_reference_compose/derive_nsfw.py - change flux2_reference_compose and
# re-run it, never edit this bundle by hand. Sources and node notes: see flux2_reference_compose.
#
# ─── Custom Nodes ─────────────────────────────────────────────────────────────
# Power Lora Loader (rgthree) is in nodes.lock; every other node is a built-in ComfyUI core node
# (see ../flux2_image_edit/report.md "Custom Nodes" section).
# ──────────────────────────────────────────────────────────────────────────────

name: flux2_reference_compose_nsfw
description: >
  Generates a NEW image (any camera angle or composition) from a text prompt conditioned on up to
  four reference images - the place, a character's identity, an outfit or a second character. It
  is not an edit: no input photo is preserved, the image is rendered from an empty latent at the
  requested width x height, and the references only supply identity / outfit / place. Not suitable
  for editing an existing photo in place (use flux2_image_edit) or for video output.
  NSFW variant: nudity and sex between adults, including explicit acts composed directly from the
  place and the characters (a general NSFW LoRA is baked in; act / detail LoRAs go on the ports).
url: workflow.json
workflow_type: ref2i
model_family: flux2
content: nsfw
gpu_types: [l40s, a100, h100, blackwell]
ports:
  inputs:
    - name: reference_image_1
      kind: image
      description: "Optional \"Picture 1\": the anchor of the composition - normally the PLACE (location plate) the new image is set in; its layout, lighting and props are kept. Used as a reference only: its camera and framing are NOT preserved."
      binding: image@401
      reference_role: subject
      label: "Picture 1"
      required: false
    - name: reference_image_2
      kind: image
      description: "Optional \"Picture 2\": a character (or outfit) whose identity and look to keep. Reference only: its pose and framing are NOT preserved."
      binding: image@402
      reference_role: reference
      label: "Picture 2"
      required: false
    - name: reference_image_3
      kind: image
      description: "Optional \"Picture 3\": a further reference - a second character or an outfit."
      binding: image@403
      reference_role: reference
      label: "Picture 3"
      required: false
    - name: reference_image_4
      kind: image
      description: "Optional \"Picture 4\": a further reference - a third character, an outfit or a prop. Encoded at half the resolution (0.5 MP) of the others to bound the reference token cost, so keep it a close-up of what matters."
      binding: image@404
      reference_role: reference
      label: "Picture 4"
      required: false
  params:
    - name: prompt_positive
      kind: string
      description: "Scene description incl. camera angle and framing. Refer to the supplied references as 'Picture 1'..'Picture 4' in port order, counting only the references actually supplied (supplied ports 1 and 3 are 'Picture 1' and 'Picture 2'). Do not mention a picture that was not supplied."
      binding: text@135
      required: true
    - name: width
      kind: int
      description: "Output width in pixels (multiple of 16). Default 1280 (16:9 landscape)."
      binding: value@140
      constraints: { min: 256, max: 2048 }
      required: true
      default: 1280
    - name: height
      kind: int
      description: "Output height in pixels (multiple of 16). Default 720 (16:9 landscape)."
      binding: value@141
      constraints: { min: 256, max: 2048 }
      required: true
      default: 720
    - name: steps
      kind: int
      description: "Denoising steps. This workflow uses a step-distilled FLUX.2 model — 4 steps is the tuned default; raising it adds compute cost with diminishing quality gains."
      binding: steps@137
      constraints: { min: 1 }
      required: true
      default: 4
    - name: cfg
      kind: float
      description: "Classifier-free guidance scale (prompt adherence). Default 1.0 is tuned for this model; raise toward 2-3 if the prompt isn't followed closely enough, but pushing too high can distort the image."
      binding: cfg@138
      required: false
      default: 1
    - name: seed
      kind: int
      description: "Random noise seed. Set -1 or omit for a new random seed each run; reuse a seed to reproduce a render or to compare prompts on the same noise."
      binding: noise_seed@125
      seed: true
      required: false
      default: -1
  loras:
    - name: lora_1
      kind: lora
      description: "Optional LoRA slot 1 from the workspace catalog (model family flux2, trained for FLUX.2 Klein 9B: act, detail, style). Inactive unless a caller selects a LoRA for this port."
      binding: "150"
      strength: 0.8
      required: false
    - name: lora_2
      kind: lora
      description: "Optional LoRA slot 2 from the workspace catalog (model family flux2, trained for FLUX.2 Klein 9B: style, character, detail). Inactive unless a caller selects a LoRA for this port."
      binding: "150"
      strength: 0.8
      required: false
    - name: lora_3
      kind: lora
      description: "Optional LoRA slot 3 from the workspace catalog (model family flux2, trained for FLUX.2 Klein 9B: style, character, detail). Inactive unless a caller selects a LoRA for this port."
      binding: "150"
      strength: 0.8
      required: false
    - name: lora_4
      kind: lora
      description: "Optional LoRA slot 4 from the workspace catalog (model family flux2, trained for FLUX.2 Klein 9B: style, character, detail). Inactive unless a caller selects a LoRA for this port."
      binding: "150"
      strength: 0.8
      required: false
  outputs:
    - name: image
      kind: image
      description: "The composed image."
      node_id: "94"
      role: primary
context: >
  Reference-to-image (ref2i): the output starts from an empty latent of width x height and every
  supplied reference goes through ReferenceLatent (positive and negative conditioning). Camera,
  framing and composition come from the prompt, not from the references.
  - Picture 1 (reference_image_1, role subject): the anchor - normally the place; people and objects
    from Picture 2 / 3 / 4 are composed into it.
  - Picture 2 (reference_image_2) / Picture 3 (reference_image_3) / Picture 4 (reference_image_4): a
    character, a second or third character, an outfit or a prop. FLUX.2 Klein accepts at most four
    references; Picture 4 is encoded at 0.5 MP (Pictures 1-3 at 1 MP) to bound the token cost.
  - All four are optional and may be given in any combination. An absent reference is pruned from
    the graph, and the pictures are numbered by the references actually supplied, in port order:
    with only ports 1 and 3 the prompt names "Picture 1" and "Picture 2". With no reference it is a
    plain text-to-image render.
  Prompting: say the camera angle and framing explicitly ("low-angle shot from the floor", "overhead
  view"); name each subject with its picture ("Brianna from Picture 2 sits on the bed in the
  bedroom from Picture 1"); restate the art style in the prompt when the pictures are illustrations.
  NSFW: the general NSFW LoRA SNOFS (0.7) is always on - do not select it on a port. Explicit acts
  compose in ONE call: Picture 1 = the place, Picture 2 / 3 = the two adult characters (Picture 4 optional: a third person, outfit or prop), the act and
  camera in the prompt (spike 2026-10-15: missionary 4/4 in the plate's room with both identities,
  with or without an act LoRA; blowjob 1/2). Call every person an adult. Swapping people into an
  existing frame is unreliable here - use krea2_image_edit_nsfw, one person per call.
  LoRAs: up to four flux2 catalog LoRAs on lora_1..lora_4 (Klein 9B distilled ones work best;
  0.5-1.0 strength).
  Parameters: steps 4 and cfg 1 are tuned for this step-distilled model; vary the seed for
  alternative takes; width / height must be multiples of 16.
