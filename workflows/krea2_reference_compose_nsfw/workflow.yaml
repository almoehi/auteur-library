# ─── Source ───────────────────────────────────────────────────────────────────
# krea2_reference_compose_nsfw - the graph of krea2_image_edit_nsfw (Krea 2 Identity Edit by conradlocke / lbouaraba:
#   https://github.com/lbouaraba/comfyui-krea2edit (nodes, Apache-2.0)
#   https://huggingface.co/conradlocke/krea2-identity-edit (LoRA v1.2, Krea 2 Community License)
# on the Krea 2 NSFW realism stack), declared as ref2i: the sampler starts from an EMPTY latent of width x height, Picture 1 and
# Picture 2 only condition it, so the camera is free while the place of Picture 1 and the person of Picture 2 stay.
# Dynamic catalog LoRAs go into the Power Lora Loader (node 15) after the baked ones.
#
# GENERATED by krea2_reference_compose/derive_reference_compose.py from krea2_image_edit_nsfw - change that bundle and re-run
# it, never edit this one by hand (its e2e-test.ts is the exception).
#
# ─── Custom Nodes ─────────────────────────────────────────────────────────────
# comfyui-krea2edit (Krea2EditModelPatch, Krea2EditGroundedEncode) via the customNodes stanza;
# Power Lora Loader (rgthree) is in nodes.lock; the rest is ComfyUI core.
#
# ─── Findings (LORA_SPIKE.md #7, 2026-11) ─────────────────────────────────────
# - Plate (Picture 1) + ONE identity reference (Picture 2) with the Krea 2 Camera Angles v2 LoRA (catalog
#   krea2_camera_angles, loaded by the keyframe renderer): a real but MODEST lowering of the camera in the same
#   room with the same person (low angle: lens at tabletop height). Words alone moved the camera far less.
# - The angle phrase leads the prompt (`low angle shot, ...`, `high angle shot from behind, ...`): the LoRA's caption order.
# - A pure edit graph (no empty latent) pins Picture 1's camera - that is why this is a separate bundle.
# - Krea 2 Identity Edit takes ONE identity picture: two people as one side-by-side Picture 2 work for simple scenes only;
#   a shot with more people belongs to flux2_reference_compose.
# - The Camera Angles LoRA is RentCivit-only (licence): a production use needs the author's permission.
# ──────────────────────────────────────────────────────────────────────────────

name: krea2_reference_compose_nsfw
description: >
  Generates a NEW image from a text prompt with Krea 2 NSFW realism (nudity allowed), conditioned on a place picture (Picture 1)
  and optionally ONE person picture (Picture 2): the place and the person are kept, the CAMERA is free. It is not an
  edit - the image is rendered from an empty latent at the requested width x height.
  Use for: a keyframe whose camera height or angle differs from the place picture's (low angle, high angle, from
  behind): put the angle phrase FIRST in the prompt ("low angle shot, ...") and load the krea2_camera_angles LoRA.
  Not for: an in-place edit of a photo (use krea2_image_edit_nsfw), a shot with more than one person to place or a plain
  shot at the place picture's own camera (use flux2_reference_compose_nsfw), text-to-image without a place or video.
url: workflow.json
workflow_type: ref2i
model_family: krea2
content: nsfw
gpu_types: [l40s, a100, h100]
ports:
  inputs:
    - name: image_1
      kind: image
      description: "Picture 1, the PLACE: the location plate (a published location picture) whose room, fixed items and light are kept; its camera is NOT - the camera comes from the prompt. Around 1 MP works best."
      binding: image@20
      reference_role: subject
      label: "Picture 1"
      required: true
    - name: image_2
      kind: image
      description: "Optional Picture 2, the identity reference: ONE person (character design) whose face, hair, skin and build are composed into the place. Leave it out for a place without a person."
      binding: image@21
      reference_role: reference
      label: "Picture 2"
      required: false
  params:
    - name: prompt_positive
      kind: string
      description: "Plain-English prompt that STARTS with the angle phrase (\"low angle shot, \" / \"high angle shot from behind, \"), then says who stands where in the place, e.g. \"low angle shot, the woman from image 2 stands at the window of the room of image 1, looking out. Keep the room and its fixed items of image 1 and the exact face, hair and build of image 2.\""
      binding: prompt@40
      required: true
      default: "The adult person from image 2 stands in the room of image 1. Keep the room, its fixed items and the lighting of image 1 and the exact face, hair and body of image 2."
    - name: width
      kind: int
      description: "Output width in pixels, multiple of 16. Keep width x height at or below ~2 MP (above it, source content bleeds and subjects duplicate). Match Picture 1's aspect ratio."
      binding: width@30
      constraints: { min: 256, max: 2048 }
      required: true
      default: 1344
    - name: height
      kind: int
      description: "Output height in pixels, multiple of 16. See width."
      binding: height@30
      constraints: { min: 256, max: 2048 }
      required: true
      default: 768
    - name: steps
      kind: int
      description: "Sampling steps. 8 favors instruction adherence, 12 face detail; 10 is balanced."
      binding: steps@50
      constraints: { min: 1, max: 50 }
      required: false
      default: 10
    - name: cfg
      kind: float
      description: "Guidance. 1.0 with the turbo LoRA at full strength; the negative branch only matters above 1."
      binding: cfg@50
      required: false
      default: 1.0
    - name: seed
      kind: int
      description: "Random seed. -1 or omit for a random seed."
      binding: seed@50
      seed: true
      required: false
      default: -1
    - name: ref_boost
      kind: float
      description: "Identity fidelity dial for Picture 2 (multiplies attention to it). 1 = off, 4 = strong likeness (recommended), >10 = over-copying."
      binding: ref_boost@31
      constraints: { min: 0, max: 20 }
      required: false
      default: 4.0
    - name: ref_boost_a
      kind: float
      description: "Same dial for Picture 1. 1 = off; raise it if the pose or room drifts."
      binding: ref_boost_a@31
      constraints: { min: 0, max: 20 }
      required: false
      default: 1.0
    - name: grounding_px
      kind: int
      description: "Longest side of the images the text encoder sees while reading the instruction. Trained range 384-768; lower favors edit adherence, higher likeness."
      binding: grounding_px@40
      constraints: { min: 0, max: 4096 }
      required: false
      default: 768
    - name: nsfw_strength
      kind: float
      description: "KNPV NSFW LoRA strength; 0 disables it."
      binding: strength_model@13
      constraints: { min: 0, max: 2 }
      required: false
      default: 0.9
    - name: identity_strength
      kind: float
      description: "Krea 2 Identity Edit LoRA strength."
      binding: strength_model@14
      constraints: { min: 0, max: 2 }
      required: false
      default: 1.0
  loras:
    - name: lora_1
      kind: lora
      description: "Optional krea2 catalog LoRA slot 1 (e.g. an anatomy or detail LoRA). Stacks after the baked-in LoRAs. Act LoRAs barely change poses in an edit - use them with krea2_base_realism_nsfw."
      binding: "15"
      strength: 0.8
      required: false
    - name: lora_2
      kind: lora
      description: "Optional krea2 catalog LoRA slot 2 (e.g. an anatomy or detail LoRA). Stacks after the baked-in LoRAs. Act LoRAs barely change poses in an edit - use them with krea2_base_realism_nsfw."
      binding: "15"
      strength: 0.8
      required: false
    - name: lora_3
      kind: lora
      description: "Optional krea2 catalog LoRA slot 3 (e.g. an anatomy or detail LoRA). Stacks after the baked-in LoRAs. Act LoRAs barely change poses in an edit - use them with krea2_base_realism_nsfw."
      binding: "15"
      strength: 0.8
      required: false
    - name: lora_4
      kind: lora
      description: "Optional krea2 catalog LoRA slot 4 (e.g. an anatomy or detail LoRA). Stacks after the baked-in LoRAs. Act LoRAs barely change poses in an edit - use them with krea2_base_realism_nsfw."
      binding: "15"
      strength: 0.8
      required: false
  outputs:
    - name: image
      kind: image
      description: "The composed image."
      node_id: "52"
      role: primary
customNodes:
  - name: comfyui-krea2edit
    repository: https://github.com/lbouaraba/comfyui-krea2edit.git
    commitHash: 86f886dac23013d88996e3a2e99093ba44d322fb

context: >
  Use for: a keyframe whose camera height or angle differs from the place picture's. Picture 1 = the place (the
  location plate), Picture 2 = ONE person (a character design); both only condition the render (Picture 2 is optional, an absent one is pruned), the output
  starts from an empty latent, so the camera comes from the prompt.
  Not for: an in-place edit of a photo (use krea2_image_edit_nsfw), several people (use flux2_reference_compose_nsfw), a plain shot at the plate's own camera.

  Word the prompt with the ANGLE PHRASE FIRST and no other camera words: "low angle shot, <the person> from image 2 in the
  place of image 1, ..." or "high angle shot from behind, ...". Say what to keep: the room and its fixed items of image 1,
  the exact face, hair and build of image 2. The krea2_camera_angles LoRA (catalog) does the lowering / raising; without
  it the words alone move the camera only a little. Two people in one Picture 2 swap unreliably - give ONE person. Nudity allowed (the KNPV + filter-bypass LoRAs are baked in; call every person an adult). An explicit act does not
  come out of this graph (see krea2_image_edit_nsfw). Frame people large: small figures barely take the identity. ~2 min per image on l40s.

