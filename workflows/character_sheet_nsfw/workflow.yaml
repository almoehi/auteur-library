# ─── Source ───────────────────────────────────────────────────────────────────
# One character image -> a 15-panel NSFW character reference sheet. Each panel re-poses the
# character into a grey-mannequin pose template with Krea 2 Identity Edit (two-reference mode:
# image 1 = template, image 2 = character) on the Krea 2 realism NSFW stack, then the panels are
# laid out as one sheet. workflow.json is GENERATED by build_workflow.py (edit that, then re-run it).
#   nodes: https://github.com/lbouaraba/comfyui-krea2edit (Apache-2.0)
#   LoRA:  https://huggingface.co/conradlocke/krea2-identity-edit (v1.2, Krea 2 Community License)
#
# ─── Pose templates ───────────────────────────────────────────────────────────
# 15 per gender, public PNGs in the model-cache bucket (templates.json; content hash in each key),
# loaded by URL with the WAS "Image Load" node (was-node-suite, nodes.lock). Only the chosen
# gender's set is downloaded: every gender/background choice is a lazy core ComfySwitchNode.
#
# ─── Custom Nodes ─────────────────────────────────────────────────────────────
# comfyui-krea2edit (Krea2EditModelPatch, Krea2EditGroundedEncode) via the customNodes stanza;
# Image Load (WAS), ImageResize+ (essentials) are in nodes.lock; the rest is ComfyUI core.
# ──────────────────────────────────────────────────────────────────────────────

name: character_sheet_nsfw
description: >
  Turns ONE image of a character into a 15-panel nude character reference sheet with fixed poses:
  full body front, side and back; four body poses; a standing pose; a front portrait; and
  portraits / facial expressions (female) or expressions / lying poses (male). Choose the gender
  of the pose set; optionally a pure white panel background instead of grey. Identity (face, hair,
  skin, build) comes from the image. Best input: the character full-body, nude, on a plain backdrop.
  Not for clothed sheets, custom poses, text-to-image or video.
url: workflow.json
workflow_type: i2i
model_family: krea2
capabilities: [character-sheet]
gpu_types: [l40s, a100, h100]
ports:
  inputs:
    - name: character_image
      kind: image
      description: "The character whose identity fills every panel. Best: one person, full body, nude, standing, facing the camera on a plain backdrop, at least ~1 MP."
      binding: image@21
      reference_role: reference
      required: true
  params:
    - name: gender
      kind: enum
      description: "Which pose set and sheet layout to use: female (crawling, sitting, kneeling-straddle poses, looking-up portraits, 4 expressions) or male (kneeling, seated, plank poses, 4 expressions, lying side and top). Pick the character's gender."
      binding: value@60
      constraints: { enum: [female, male] }
      required: false
      default: female
    - name: white_background
      kind: bool
      description: "true = every panel on a pure white seamless studio background, with black gutters between the sheet's panel groups; false = the templates' plain grey studio background with white gutters."
      binding: value@62
      required: false
      default: false
    - name: identity_prompt
      kind: string
      description: "Identity sentence appended to every panel's instruction except the rear view (there it pulls the face toward the camera). The default asks to keep face, hair, eyes, skin and build of the image. Naming the character's distinctive features (e.g. \"green eyes, freckles, long wavy copper-red hair\") makes them more consistent across panels."
      binding: value@63
      required: false
      default: "Preserve the exact facial identity, hairstyle, hair colour, eye colour, skin tone and body build of the person in image 2."
    - name: seed
      kind: int
      description: "Random seed shared by all panels. -1 or omit for a random seed."
      binding: value@68
      seed: true
      required: false
      default: -1
    - name: steps
      kind: int
      description: "Sampling steps per panel (15 panels are sampled one after another). 8 favors pose adherence, 12 face detail; 10 is balanced."
      binding: value@69
      constraints: { min: 4, max: 20 }
      required: false
      default: 10
    - name: nsfw_strength
      kind: float
      description: "KNPV NSFW LoRA strength (anatomical detail); 0 disables it."
      binding: strength_model@13
      constraints: { min: 0, max: 2 }
      required: false
      default: 0.9
    - name: identity_strength
      kind: float
      description: "Krea 2 Identity Edit LoRA strength. Keep 1.0; at 0.6 the panels break up."
      binding: strength_model@14
      constraints: { min: 0.8, max: 1.5 }
      required: false
      default: 1.0
  outputs:
    - name: character_sheet
      kind: image
      description: "The 15-panel sheet, 3872x2176: full body front|side|back, 2x2 poses, standing pose; front portrait, then female: looking-up portraits + 2x2 expressions, male: 2x2 expressions + lying side over lying top."
      node_id: "9000"
      role: primary
    - name: view_1
      kind: image
      description: "Full body, front view (768x1920)."
      node_id: "9001"
      role: auxiliary
    - name: view_2
      kind: image
      description: "Full body, exact left profile (768x1920)."
      node_id: "9002"
      role: auxiliary
    - name: view_3
      kind: image
      description: "Full body, rear view (768x1920)."
      node_id: "9003"
      role: auxiliary
    - name: portrait
      kind: image
      description: "Head-and-shoulders front portrait (1216x1024)."
      node_id: "9004"
      role: auxiliary
customNodes:
  - name: comfyui-krea2edit
    repository: https://github.com/lbouaraba/comfyui-krea2edit.git
    commitHash: 86f886dac23013d88996e3a2e99093ba44d322fb

context: >
  Renders the character nude in fixed poses; give it one clear image of the character. The 15
  panels are sampled sequentially in one job (several minutes). Composition comes from the pose
  templates and cannot be changed by text; the identity_prompt only sharpens identity.

