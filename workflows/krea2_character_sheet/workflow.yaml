# ─── Source ───────────────────────────────────────────────────────────────────
# Original workflow by lumosai8 (OrbitSheets)
# https://github.com/lumosai8/ComfyUI-OrbitSheets
# https://www.reddit.com/r/StableDiffusion/comments/1vov6jb/create_full_character_location_sheets_in_seconds/
#
# ─── Custom Nodes ─────────────────────────────────────────────────────────────
# ComfyUI-OrbitSheets (OrbitSheetsCharacterPrompt, OrbitSheetsFrameSelect,
#   OrbitSheetsContactSheet, OrbitSheetsAttentionBackend) — loaded dynamically
#   via the customNodes stanza below; no nodes.lock entry needed.
# MiniMaxH3ImageToVideo, MiniMaxH3SigmaShift, VAEDecodeAudio, CreateVideo,
#   SaveVideo — ComfyUI-MiniMax-H3-Turbo (Larryvrh) — already in nodes.lock.
# ──────────────────────────────────────────────────────────────────────────────

name: krea2_character_sheet
description: >
  Generates a six-panel character turnaround contact sheet from a plain-English description:
  front full-body, face close-up, left profile, right profile, rear, and a frightened expression.
  Best for character references in fashion, game art, concept art, and cosplay. Not suitable for
  scene or location sheets, single-image output, or image-to-sheet conversion.
url: workflow.json
workflow_type: t2i
model_family: krea2
gpu_types: [l40s, a100, h100]
ports:
  params:
    - name: prompt_character
      kind: string
      description: "Character description for the turnaround sheet — describe physical appearance, clothing, and expression in plain English. Do not include backdrop or background instructions; the workflow applies a neutral grey studio backdrop automatically."
      binding: value@10
      required: true
      default: "A photography of full body of a beautiful blonde american woman with blue eyes age 25 with beautiful body shape wearing a beautiful dress."
    - name: width
      kind: int
      description: "KREA-2 anchor image width in pixels. This controls the still-image generation stage; the H3 orbit video always runs at 1216×672. Must be divisible by 16."
      binding: width@27
      constraints: { min: 256, max: 2048 }
      required: true
      default: 1920
    - name: height
      kind: int
      description: "KREA-2 anchor image height in pixels. This controls the still-image generation stage; the H3 orbit video always runs at 1216×672. Must be divisible by 16."
      binding: height@27
      constraints: { min: 256, max: 2048 }
      required: true
      default: 1080
    - name: steps
      kind: int
      description: "KREA-2 denoising steps for the anchor image. 6–10 gives good quality; 8 is the recommended default."
      binding: steps@28
      constraints: { min: 1, max: 30 }
      required: true
      default: 8
    - name: frames
      kind: int
      description: "Number of frames for the H3 orbit video. 124 frames covers six shots at 0.75 s each (plus the final frightened-face shot running to clip end) at 24 FPS."
      binding: length@44
      constraints: { min: 32 }
      required: false
      default: 124
    - name: fps
      kind: int
      description: "Output video frame rate in frames per second. 24 is the native MiniMax H3 rate."
      binding: fps@78
      constraints: { min: 1 }
      required: false
      default: 24
    - name: seed
      kind: int
      description: "Random seed for the KREA-2 anchor image. Set -1 or omit for a random result each run."
      binding: seed@28
      seed: true
      required: false
      default: -1
  outputs:
    - name: character_sheet
      kind: image
      description: "Six-panel character turnaround contact sheet assembled from CLIP-selected canonical views (front, face close-up, left profile, right profile, rear, frightened expression)."
      node_id: "70"
      role: primary
    - name: orbit_video
      kind: video
      description: "Full orbit video generated by MiniMax H3 FL2VA before frame selection — useful for inspecting the full turnaround motion and troubleshooting sheet quality."
      node_id: "79"
      role: auxiliary
    - name: voice_track
      kind: audio
      description: "AI-generated voice audio track produced alongside the orbit video by H3 FL2VA using the baked-in spoken line."
      node_id: "72"
      role: auxiliary
    - name: anchor_preview
      kind: image
      description: "Preview of the KREA-2 anchor frame (full-body front view) before H3 orbit generation — useful for verifying the base character render."
      node_id: "75"
      role: auxiliary
    - name: pose_front
      kind: image
      description: "Individual selected pose frame, front full-body view. Best-effort — may occasionally not match the intended shot."
      node_id: "82"
      role: auxiliary
    - name: pose_face_closeup
      kind: image
      description: "Individual selected pose frame, tight face close-up view. Best-effort — may occasionally not match the intended shot."
      node_id: "84"
      role: auxiliary
    - name: pose_left_profile
      kind: image
      description: "Individual selected pose frame, left side profile view. Best-effort — may occasionally not match the intended shot."
      node_id: "86"
      role: auxiliary
    - name: pose_right_profile
      kind: image
      description: "Individual selected pose frame, right side profile view. Best-effort — may occasionally not match the intended shot."
      node_id: "88"
      role: auxiliary
    - name: pose_rear
      kind: image
      description: "Individual selected pose frame, rear view. Best-effort — may occasionally not match the intended shot."
      node_id: "90"
      role: auxiliary
    - name: pose_frightened
      kind: image
      description: "Individual selected pose frame, frightened-expression close-up. Best-effort — may occasionally not match the intended shot."
      node_id: "92"
      role: auxiliary
customNodes:
  - name: ComfyUI-OrbitSheets
    repository: https://github.com/lumosai8/ComfyUI-OrbitSheets.git
    commitHash: 8952eae1d3298f241c538c029a6e929509c4813f

context: >
  Best for character reference sheets when you have a clear physical description. Works well
  for fashion, cosplay, concept-art, and game characters with distinctive appearance traits.

  Prompting: describe physical appearance, clothing, and posture only. A neutral grey studio
  backdrop is applied automatically — do not include backdrop or environment instructions; they
  will conflict. A frightened expression view is always included regardless of prompt content.

  Parameter guidance:
  - steps: 6–10 gives good quality; 8 is the recommended default.
  - frames: controls orbit coverage; 124 (default) reliably captures all six canonical views.
    Reduce for faster iteration; increase if a view gets cut short.
  - seed: controls the anchor image and orbit. Vary this if panels are blurry or duplicate
    angles appear.
  - width / height: control the anchor image resolution only. The orbit video always runs at
    1216×672 regardless.

  Known issues:
  - Duplicate or blurry panels: shot durations vary per run. Change the seed.
  - Sheet missing an expected view: increase frames (default 124 covers all six in most runs).

