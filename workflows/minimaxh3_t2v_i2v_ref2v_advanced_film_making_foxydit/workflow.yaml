  # Realism detailer. Replaces fal's Realism People adapter, which was trained
  # on 176 clips of portraits, workers and athletes — none of them this
  # material — and could only carry the look halfway before it started damping
  # the motion at strength 1.0.
  #
  # This one is trained on 1786 files at 1024 and is a detailer rather than an
  # action model: it changes how skin renders, not what bodies do. Its author
  # puts the realistic band at 1.0-2.0 and says the look strengthens the higher
  # you go, with the breaking point past 2.0 — so 1.5 leaves margin on both
  # sides. No trigger word; the strength is the control.
  #
  # Worth noting for the steps question: the author's own examples were made
  # with an 8-step turbo LoRA, and this workflow runs 4.
  - name: PlagueKind-tiddies-realismslider
    type: lora
    dest: loras/MINIMAX/
    files:
      - url: https://civitai.com/api/download/models/3229050?fileId=3111384
        filename: PlagueKind-tiddies-realismslider.safetensors
        sha256: e5c8c275af58663a664ad2922cc10a248bff70b941043375d2c82d9cc55b7030

