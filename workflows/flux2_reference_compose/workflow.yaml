# https://comfy.org/workflows/image_flux2_klein_9b_kv_image_edit-546732126bf6/
#
# ─── Custom Nodes ─────────────────────────────────────────────────────────────
# (none — every node class in this workflow is a built-in ComfyUI core node;
#  see report.md "Custom Nodes" section)
# ──────────────────────────────────────────────────────────────────────────────

name: flux2_reference_compose
description: >
  SPIKE. Generates a NEW image from a text prompt while conditioning on up to three reference images (character, outfit, location plate) via FLUX.2 ReferenceLatent on an empty latent of the requested size. Camera and framing come from the prompt, not from the references.
url: workflow.json
workflow_type: i2i
model_family: flux2
gpu_types: [l40s, a100, h100, blackwell]
ports:
  inputs:
    - name: reference_image_1
      kind: image
      description: "Optional \"Picture 1\": the subject (character) whose identity to keep. Used as a reference only - its framing is NOT preserved."
      binding: image@401
      reference_role: subject
      label: "Picture 1"
      required: false
    - name: reference_image_2
      kind: image
      description: "Optional \"Picture 2\": a further reference (second character / outfit)."
      binding: image@402
      reference_role: reference
      label: "Picture 2"
      required: false
    - name: reference_image_3
      kind: image
      description: "Optional \"Picture 3\": the location plate whose place to keep."
      binding: image@403
      reference_role: background
      label: "Picture 3"
      required: false
  params:
    - name: prompt_positive
      kind: string
      description: "Scene description incl. camera angle. Refer to the references as 'Picture 1..3'."
      binding: text@135
      required: true
    - name: width
      kind: int
      description: "Output width in pixels (multiple of 16)."
      binding: value@140
      constraints: { min: 16 }
      required: true
      default: 1280
    - name: height
      kind: int
      description: "Output height in pixels (multiple of 16)."
      binding: value@141
      constraints: { min: 16 }
      required: true
      default: 720
    - name: steps
      kind: int
      description: "Denoising steps. This workflow uses a step-distilled FLUX.2 model — 4 steps is the tuned default; raising it adds compute cost with diminishing quality gains."
      binding: steps@137
      constraints: { min: 1 }
      required: true
      default: 4
    - name: cfg
      kind: float
      description: "Classifier-free guidance scale (prompt adherence). Default 1.0 is tuned for this model; raise toward 2-3 if the edit isn't following the prompt closely enough, but pushing too high can distort the image."
      binding: cfg@138
      required: false
      default: 1
    - name: seed
      kind: int
      description: "Random noise seed. Set -1 or omit for a new random seed each run; reuse a seed to reproduce an edit or to compare instructions on the same noise."
      binding: noise_seed@125
      seed: true
      required: false
      default: -1
  outputs:
    - name: image
      kind: image
      description: "The composed image."
      node_id: "94"
      role: primary
context: >
  SPIKE. Reference-to-image: the output starts from an empty latent of width x height; every supplied
  reference goes through ReferenceLatent as "Picture 1".."Picture 3". Absent optional refs are not pruned
  transitively by the harness yet - load a graph variant per reference count.
models:
  - name: flux-2-klein-9b-kv-fp8
    type: diffusion_models
    files:
      - url: https://huggingface.co/black-forest-labs/FLUX.2-klein-9b-kv-fp8/resolve/main/flux-2-klein-9b-kv-fp8.safetensors
        filename: flux-2-klein-9b-kv-fp8.safetensors
        sha256: "33f7da5625a00798349a719742999d3c7dd20c1a7eda14663922c363640728f1"

  - name: qwen_3_8b_fp8mixed
    type: clip
    files:
      - url: https://huggingface.co/PatrickZane/qwen_3_8b_fp8mixed.safetensors/resolve/main/qwen_3_8b_fp8mixed.safetensors
        filename: qwen_3_8b_fp8mixed.safetensors
