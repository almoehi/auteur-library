# ─── Source ───────────────────────────────────────────────────────────────────
# SFW fork of h3_clip_continuation_nsfw (derived from the MiniMax H3 video-to-video continuation
# workflow and prompt system by bitsofintelligence101-lab,
# https://github.com/bitsofintelligence101-lab/workflows/tree/main/nsfw/h3): the skin-realism and
# anatomy LoRAs are removed (only the LightX2V turbo LoRA stays baked in), and width / height come
# from the prior clip (clip_info -> clip_w / clip_h, snapped to a multiple of 32) instead of params.
# The prior clip's last frame (our_seam_frame) is both the frame-0 keyframe and reference image 0,
# so <Picture 1> is the start frame here as in h3_single_cut_clip and ref<n> is <Picture n+1> in both.
# Sibling for the first clip / a clip after a cut: h3_single_cut_clip.
#
# ─── Custom Nodes (all already in serverless-comfy/nodes.lock) ────────────────
# MiniMaxH3ReferenceToVideo, MiniMaxH3SigmaShift, VAEDecodeAudio  built-in ComfyUI
# H3KeyframeInject, H3LastFrame, H3ReferenceAudio   https://github.com/jlucasmcrell/ComfyUI-H3-Multishot
#   (H3KeyframeInject is registered by the pack's h3_avbank_probe.py; it also patches the model's
#   extra_conds so reference rows and the start keyframe can be combined. H3ReferenceAudio is the
#   pack's h3_advanced.py: it forces the reference to stereo 32 kHz and its first max_seconds)
# SolAttnPatch                    https://github.com/kijai/ComfyUI-SolAttn_triton
# PathchSageAttentionKJ           https://github.com/kijai/ComfyUI-KJNodes
# VHS_LoadVideoFFmpeg, VHS_VideoInfoLoaded, VHS_VideoInfoSource, VHS_VideoCombine  https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite
#   (VHS_VideoInfoSource reports prior_clip's own rate, parsed from ffmpeg - not the loader's force_rate 24)
# Power Lora Loader / Any Switch (rgthree)  https://github.com/rgthree/rgthree-comfy
# ComfyMathExpression             built-in ComfyUI (comfy_extras/nodes_math)
# RIFE VFI                        https://github.com/Fannovel16/ComfyUI-Frame-Interpolation
# ComfySwitchNode                 built-in ComfyUI (lazy: prior_clip above 24 fps -> RIFE 2x frames at 48,
#                                 else the native frames at 24; RIFE does not run for a 24 fps prior clip)
# easy seed                       https://github.com/yolain/ComfyUI-Easy-Use
# ──────────────────────────────────────────────────────────────────────────────

name: h3_clip_continuation
description: >
  Continues a rendered clip without a cut - video with synchronized audio - from the prior clip
  (required) plus up to seven optional reference images and a structured MiniMax H3 continuation
  prompt. The new clip starts on the prior clip's exact last frame, keeps its resolution and
  carries its voices over. Chain it: feed each output back as prior_clip. Not for a first clip or
  a new shot after a cut - use h3_single_cut_clip.
url: workflow.json
workflow_type: ref2va
capabilities: [video-continuation]  # continues the prior clip from its exact last frame: the clip planner keeps a `continue` and shoot_clip renders it here (server: continuationClipWorkflowOf)
# Declared MiniMax H3 camera/limits (camera spike 2026-11-02 + clip runs): read by the clip planner and shoot-clip from workflow_index
camera:
  reliable: [push in, pull out, arc, truck, pan, tilt, rack focus, hold]  # zoom = push in (no lens zoom); pan reveal is subtle (~10% of the width: name the target); rack focus works when both ends are named
  max_arc_degrees: 45  # only an arc changes the side seen, 15-45 degrees per clip; pan / tilt never do
  unreliable: [crane, pedestal, whip pan, dolly zoom]  # pedestal / crane give only a small height change; dolly zoom is not performed
limits:
  - class: medium-transition  # a body entering or leaving another medium fails inside one clip
    note: "Entering or leaving water (or another medium) inside one clip fails: cut at take-off and start the next clip already in the new medium."
  - class: micro-motion  # small motions render static
    note: "Micro-motions (fingertips, blinks) stay static: write a larger visible motion or a close insert of the thing."
  - class: late-interaction  # hand-offs drift late in the clip
    note: "Hand-offs and contact later than about 3 s into the clip drift: put the interaction early and keep it short."
    max_start_seconds: 3
  - class: short-utterance  # one-word whisper is inaudible
    note: "A one-word whisper is inaudible: a spoken line needs at least 3 words."
    min_words: 3
model_family: minimaxh3
render_timeout_sec: 3600  # ~20 min typical H3 clip renders; the default 1800 s is too tight
gpu_types: [h100, b200] # H100 while B200 has no capacity (2026-10-28; was pinned to B200 on 2026-10-26). Dispatch picks the cheapest deployed listed GPU, so this runs on H100.
# sage_attention ships "disabled" (node our_sage_kj). The upstream graph's SageAttention patch failed on
# l40s (sm_89) and h100 (sm_90) with "CUDA error: no kernel image is available" because the
# SageAttention wheel in the compute image carries sm_80 kernels only. The harness also forces
# sage_attention to "disabled" on h100 (SAGE_BLACKLIST_GPU_TYPES). Production renders ran on b200;
# a100 is the e2e card; h100 is declared but UNVERIFIED for this bundle - the harness lists
# SolAttnPatch (still in this graph) among the nodes that can hit the same missing-kernel error.

ports:
  inputs:
    - name: prior_clip
      kind: video
      description: "The clip being continued, addressed as <Video 1>. It is read from prior_clip_start_time onward as the motion reference, and its final frame is pinned as the first frame of the new clip. Feed the previous output here when chaining."
      binding: video@177
      required: true
    - name: ref1
      kind: image
      description: "Optional reference 1, addressed as <Picture 2>. Recommended: the identity / design sheet of the main character in the shot - the same image (and the same <Picture 2>) as h3_single_cut_clip's ref1. Re-supply it on every continuation of a chain to prevent identity drift."
      binding: image@ref_image_1
      reference_role: reference
      label: "Picture 2"
      required: false
    - name: ref2
      kind: image
      description: "Optional reference 2, addressed as <Picture 3>. A second character, an outfit, the location plate (empty set), a prop or a pose - the same image as h3_single_cut_clip's ref2 when that clip had one. Give it a one-line role in subject_definitions. Supply only when ref1 is supplied."
      binding: image@ref_image_2
      reference_role: reference
      label: "Picture 3"
      required: false
    - name: ref3
      kind: image
      description: "Optional reference 3, addressed as <Picture 4>. A second character, an outfit, the location plate (empty set), a prop or a pose - the same image as h3_single_cut_clip's ref3 when that clip had one. Give it a one-line role in subject_definitions. Supply only when ref2 is supplied."
      binding: image@ref_image_3
      reference_role: reference
      label: "Picture 4"
      required: false
    - name: ref4
      kind: image
      description: "Optional reference 4, addressed as <Picture 5>. A second character, an outfit, the location plate (empty set), a prop or a pose - the same image as h3_single_cut_clip's ref4 when that clip had one. Give it a one-line role in subject_definitions. Supply only when ref3 is supplied."
      binding: image@ref_image_4
      reference_role: reference
      label: "Picture 5"
      required: false
    - name: ref5
      kind: image
      description: "Optional reference 5, addressed as <Picture 6>. A second character, an outfit, the location plate (empty set), a prop or a pose - the same image as h3_single_cut_clip's ref5 when that clip had one. Give it a one-line role in subject_definitions. Supply only when ref4 is supplied."
      binding: image@ref_image_5
      reference_role: reference
      label: "Picture 6"
      required: false
    - name: ref6
      kind: image
      description: "Optional reference 6, addressed as <Picture 7>. Same uses as ref2. Supply only when ref5 is supplied."
      binding: image@ref_image_6
      reference_role: reference
      label: "Picture 7"
      required: false
    - name: ref7
      kind: image
      description: "Optional reference 7, addressed as <Picture 8>. Same uses as ref2. Supply only when ref6 is supplied."
      binding: image@ref_image_7
      reference_role: reference
      label: "Picture 8"
      required: false
    - name: end_frame
      kind: image
      description: "Optional: the frame the new clip must END on, pinned as its LAST frame (H3KeyframeInject end_image, cover-cropped to the clip size). It is a pose anchor only - it is not shown to the text encoder, so never cite it as a <Picture N> and it does not shift the numbering of ref1..ref7. Supply it only when the shot's planned end is reachable from the prior clip's real end (the storyboard keyframe) or from a frame derived from that real end; when omitted the clip ends wherever the prompt leads."
      binding: image@end_frame_img
      reference_role: end_frame
      required: false
    - name: prior_clip_audio
      kind: video
      description: "Optional: the same clip as prior_clip, passed a second time. It is read whole and only its soundtrack is used, as the voice reference (first 5 seconds), addressed as <Audio 1>. Supply it whenever prior_clip_start_time is above 0, because the trimmed read window is then too short to carry the voices. When omitted, the voice reference is the audio of the prior_clip read window."
      binding: video@our_ref_audio_src
      required: false
    - name: voice_ref_1
      kind: audio
      description: "Optional stereo 32 kHz voice-timbre reference of ONE speaker (about 5 s of that character's voice, a .wav; mono or another rate is converted, only the first 5 s are used), referenced in the prompt as <Audio 2> (<Audio 1> is always the prior clip's mixed soundtrack - never cite it as anyone's voice when a voice reference is supplied). ALWAYS fill voice_ref_1 before voice_ref_2: ComfyUI numbers the audio inputs that are connected in order. In the prompt state it with one line: '<Audio 2> is the voice-timbre reference for <Subject N> (S#).' - the model then speaks that subject's dialogue in this timbre. When omitted the graph runs exactly as without voice references."
      binding: audio@voice_ref_1
      required: false
    - name: voice_ref_2
      kind: audio
      description: "Optional stereo 32 kHz voice-timbre reference of a SECOND speaker (about 5 s of that character's voice, a .wav; mono or another rate is converted, only the first 5 s are used), referenced in the prompt as <Audio 3>. Supply it only when voice_ref_1 is supplied (the numbering is by order of connection). In the prompt state it with one line: '<Audio 3> is the voice-timbre reference for <Subject N> (S#).' - the model then speaks that subject's dialogue in this timbre. When omitted the graph runs exactly as without voice references."
      binding: audio@voice_ref_2
      required: false
  params:
    - name: prompt_positive
      kind: string
      description: "MiniMax H3 continuation prompt in English (use the prompt-writer-minimaxh3 skill). Six sections in order: (1) context header - how <Video 1> and the pictures align with the target and the target duration; (2) summary, starting with [video continuation]; (3) subject_definitions - <Video 1>, <Audio 1>, <Picture 1> (the seam frame: the last frame of <Video 1>) and one entry per supplied <Picture N> (ref<n> = <Picture n+1>); (4) integrated_multimodal_description - timestamped shots, resuming from the final frame of <Video 1>; (5) overall_soundscape; (6) non_diegetic_music. Only cite <Picture N> for images that were supplied. When voice_ref_k is supplied, add the line '<Audio k+1> is the voice-timbre reference for <Subject n> (S#).' to subject_definitions (<Audio 1> is the prior clip's soundtrack)."
      binding: value@182
      append_section: integrated_multimodal_description
      required: true
    - name: duration_seconds
      kind: float
      description: "Target clip duration in seconds. Converted to the nearest valid MiniMax H3 frame count at the native 24 fps."
      binding: value@158
      constraints: { min: 1.0, max: 30.0 }
      required: false
      default: 10.0
      role: duration
    - name: prior_clip_start_time
      kind: float
      description: "Seconds offset into prior_clip from which its frames are read as the motion reference. Use <clip length - 1> to read only the last second (e.g. 9.0 for a 10-second clip); 0 reads the whole clip, which is slower. The seam frame is always the last frame of the clip."
      binding: value@vf_start_time
      constraints: { min: 0.0 }
      required: false
      default: 0.0
    - name: steps
      kind: int
      description: "Denoising steps. The baked-in turbo LoRA (0.7) is tuned for 6-8 steps; 4 is the fastest usable draft."
      binding: steps@141
      constraints: { min: 1, max: 50 }
      required: false
      default: 8
    - name: seed
      kind: int
      description: "Noise seed. -1 draws a new one, so a second take differs from the first."
      binding: seed@our_seed
      seed: true
      required: false
      default: -1
    - name: fps
      kind: int
      description: "Ignored: the output rate follows prior_clip (24 or 48) - the graph reads prior_clip's own frame rate and encodes RIFE 2x frames at 48 when it is above 24, else the native frames at 24, so the join always matches. Declared only because the workflow loader requires an fps param on every video workflow."
      binding: value@fps_declared
      constraints: { min: 1, max: 120 }
      required: false
      default: 48
    - name: sage_attention
      kind: string
      description: "SageAttention mode of the KJNodes patch. Leave at 'disabled' unless the compute image is known to carry SageAttention kernels for the card."
      binding: sage_attention@our_sage_kj
      required: false
      default: disabled
  # Node our_loras (Power Lora Loader (rgthree)) carries the lora slots. bindWorkflow()
  # (video-harness/src/render/manifest.ts) KEEPS the workflow.json-authored slot verbatim: the
  # always-on LightX2V turbo distillation (lora_1, 0.7) needs no port and can never be wiped or
  # overwritten by a port. Each port below that resolves to a lora (a workspace lora-catalog name)
  # is APPENDED after it, in declaration order. `default` is left UNSET on all four: a default would
  # append that lora on every render. `strength` is only the fallback for a catalog entry that
  # declares none - strength resolves call-time lora_<port>_strength -> catalog default -> this value.
  loras:
    - name: lora_1
      kind: lora
      description: "Optional LoRA slot 1 (style, character or motion adapter trained for MiniMax H3). Appended after the always-on turbo LoRA baked into the workflow. Inactive unless a catalog lora name is passed. Pick from lora_index (modelFamily minimaxh3); keep the adapters of the clip being continued. Never select the turbo LoRA here - that loads a second copy."
      binding: "our_loras"
      strength: 0.8
      required: false
    - name: lora_2
      kind: lora
      description: "Optional LoRA slot 2. Stacks on top of the turbo LoRA and lora_1. Inactive unless a catalog lora name is passed."
      binding: "our_loras"
      strength: 0.8
      required: false
    - name: lora_3
      kind: lora
      description: "Optional LoRA slot 3. Stacks on top of the turbo LoRA and lora_1-lora_2. Inactive unless a catalog lora name is passed."
      binding: "our_loras"
      strength: 0.8
      required: false
    - name: lora_4
      kind: lora
      description: "Optional LoRA slot 4. Stacks on top of the turbo LoRA and lora_1-lora_3. Inactive unless a catalog lora name is passed."
      binding: "our_loras"
      strength: 0.8
      required: false
  outputs:
    - name: output_video
      kind: video
      description: "Continuation video with audio at prior_clip's rate: RIFE 2x interpolated and encoded at 48 when prior_clip is above 24 fps, else the native frames at 24."
      node_id: "176"
      role: primary
context: |
  Seam: the new clip starts on the exact last frame of prior_clip (pinned as a frame-0 keyframe),
  and reads prior_clip from prior_clip_start_time onward as the motion reference. Read only the
  last second or so of a long clip; pass the same clip as prior_clip_audio so the voices carry
  over. Width and height are taken from the prior clip (snapped to a multiple of 32) and so is
  the output rate: a prior clip above 24 fps gives a 48 fps clip (RIFE 2x), one at 24 fps or below
  a 24 fps clip (no interpolation) - the duration is the same either way.

  Pictures: <Picture 1> is always the last frame of prior_clip - the first frame of the new clip -
  added automatically (pass nothing for it); it is also what h3_single_cut_clip calls <Picture 1>
  (its start frame). ref1-ref7 are optional and are <Picture 2>-<Picture 8> in attachment order,
  the SAME numbers as h3_single_cut_clip's ref1-ref5: pass the same references on the same ports
  and its subject_definitions carry over unchanged. Pass every character, outfit, location and
  prop of the shot you have a design for - the model only keeps a look it is shown. Supply them in
  order without gaps (never ref3 without ref2) - otherwise the <Picture N> numbers in the prompt no
  longer match the ports. Cite a picture only when it was supplied, and give every cited picture a
  line in subject_definitions.

  Voices: voice_ref_1 and voice_ref_2 are optional stereo 32 kHz voice-timbre references of up to
  two speakers (audio inputs; H3ReferenceAudio guards channels, rate and length). ComfyUI numbers
  the audio inputs that are CONNECTED in order: <Audio 1> is always the soundtrack read from
  prior_clip (the mixed voices carried over - never cite it as anyone's voice when a voice
  reference is supplied), voice_ref_1 is always <Audio 2> and voice_ref_2 (only with voice_ref_1)
  <Audio 3>. Fill voice_ref_1 first. Which speaker a reference belongs to is stated in the prompt:
  give each one line in subject_definitions: '<Audio k> is the voice-timbre reference for
  <Subject n> (S#).' Supply the same references on every clip of a scene so a speaker keeps one
  timbre across the chain.

  LoRAs: the LightX2V turbo LoRA (0.7) is baked in - do not select it on a port. lora_1-lora_4
  take style / character adapters from the workspace lora catalog (modelFamily minimaxh3); keep
  the adapters of the clip being continued.

  Prompt format - six sections, English, all required:
  1. Context header, e.g. "How the reference video and pictures align with the target video -
     <Video 1> supplies the frames immediately preceding the target video; the target video
     resumes from its final frame at the 0.00-second mark with no cut. Target duration 10 seconds."
  2. summary: "[video continuation] The target video continues <Video 1> without interruption, ..."
  3. subject_definitions: <Video 1> (inherited motion, camera, light at the seam), <Audio 1>
     (voices and room carried over), <Picture 1> (the last frame of <Video 1>, where the target
     starts), then one entry per supplied picture (ref<n> = <Picture n+1>); restate the identity
     block on every link of a chain.
  4. integrated_multimodal_description: timestamped [Shot N] entries that sum to the target
     duration; the first shot resumes from the final frame of <Video 1>; dialogue in <d>...</d>.
  5. overall_soundscape: room tone continuing from <Video 1>, voices, effects.
  6. non_diegetic_music: a cue or "N/A".

  Known failure modes: quality drops when a section is missing; the subject drifts across a chain
  when the character sheet or the identity block is dropped; a <Picture N> cited without a
  definition is ignored.

  GPU / VRAM: 40 GB minimum. First run downloads ~43 GB of models. A 10-second continuation at
  8 steps takes several minutes on a100. Shares its models with h3_single_cut_clip.
models:
  # MiniMax H3 reference-to-video weights (an A/B against the fl2va weights of the predecessor
  # bundles kept the characters closer to their reference images at the same speed).
  - name: minimax_h3_ref2va_pruned_int8_convrot
    type: unet
    files:
