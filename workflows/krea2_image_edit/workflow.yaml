# ─── Source ───────────────────────────────────────────────────────────────────
# Krea 2 Identity Edit by conradlocke / lbouaraba on the Krea 2 realism stack:
#   https://github.com/lbouaraba/comfyui-krea2edit (nodes, Apache-2.0)
#   https://huggingface.co/conradlocke/krea2-identity-edit (LoRA v1.2, Krea 2 Community License)
# Base stack = krea2_base_realism (krea2_raw_bf16 + turbo / realism LoRAs, Wan 2.1 FP32 VAE), sampled
# with a core KSampler (euler/simple) so the edit node's model patch is the only forward patch.
# Dynamic catalog LoRAs go into the Power Lora Loader (node 15) after the baked ones.
#
# krea2_image_edit_nsfw is GENERATED from this bundle by derive_nsfw.py (adds the filter-bypass and
# KNPV LoRAs, `content: nsfw` and the NSFW wording): change this bundle, then re-run it.
#
# ─── Custom Nodes ─────────────────────────────────────────────────────────────
# comfyui-krea2edit (Krea2EditModelPatch, Krea2EditGroundedEncode) via the customNodes stanza;
# Power Lora Loader (rgthree) is in nodes.lock; the rest is ComfyUI core.
#
# ─── Findings (spikes 2026-10-15) ─────────────────────────────────────────────
# - Place + person (Picture 1 = location plate, Picture 2 = a character): room, camera and identity
#   are kept. Two people as ONE side-by-side Picture 2 work for simple scenes.
# - Swap people ONE PERSON PER CALL (a two-person Picture 2 swaps the wrong person or changes the
#   scene about half the time). Small figures in a wide shot barely take the identity.
# - Global changes (time of day, lighting, camera) barely apply without a Picture 2.
# ──────────────────────────────────────────────────────────────────────────────

name: krea2_image_edit
description: >
  Edits an image by a plain-English instruction with Krea 2 Identity Edit on the Krea 2 realism stack,
  optionally bringing in a person from a second image: put a character into a location plate, swap
  one person of a frame for a character (identity from Picture 2, pose and framing from Picture 1),
  restage, recolour. People stay clothed unless the prompt says otherwise. Keeps the camera of
  Picture 1. Not text-to-image, not video.
url: workflow.json
workflow_type: i2i
model_family: krea2
capabilities: [multi-reference-edit]
gpu_types: [l40s, a100, h100]
ports:
  inputs:
    - name: image_1
      kind: image
      description: "Picture 1, the image to edit: its camera angle, framing and background are kept (a location plate, a storyboard frame, a frame whose people get swapped). Around 1 MP works best."
      binding: image@20
      reference_role: subject
      label: "Picture 1"
      required: true
    - name: image_2
      kind: image
      description: "Optional Picture 2, the identity reference: ONE person (character design) whose face, hair, skin and build go into Picture 1. Leave it out for a plain instruction edit of Picture 1."
      binding: image@21
      reference_role: reference
      label: "Picture 2"
      required: false
  params:
    - name: prompt_positive
      kind: string
      description: "Plain-English edit instruction naming the images, e.g. \"Replace the woman in image 1 with the adult woman from image 2: her exact face, red hair, skin and build. Leave the man unchanged. Keep the exact poses, camera angle, framing and room of image 1.\" Say what to keep from each image."
      binding: prompt@40
      required: true
      default: "Place the adult person from image 2 into image 1. Keep the room, the lighting and the camera angle of image 1 and the exact face, hair and body of image 2."
    - name: width
      kind: int
      description: "Output width in pixels, multiple of 16. Keep width x height at or below ~2 MP (above it, source content bleeds and subjects duplicate). Match Picture 1's aspect ratio."
      binding: width@30
      constraints: { min: 256, max: 2048 }
      required: true
      default: 1344
    - name: height
      kind: int
      description: "Output height in pixels, multiple of 16. See width."
      binding: height@30
      constraints: { min: 256, max: 2048 }
      required: true
      default: 768
    - name: steps
      kind: int
      description: "Sampling steps. 8 favors instruction adherence, 12 face detail; 10 is balanced."
      binding: steps@50
      constraints: { min: 1, max: 50 }
      required: false
      default: 10
    - name: cfg
      kind: float
      description: "Guidance. 1.0 with the turbo LoRA at full strength; the negative branch only matters above 1."
      binding: cfg@50
      required: false
      default: 1.0
    - name: seed
      kind: int
      description: "Random seed. -1 or omit for a random seed."
      binding: seed@50
      seed: true
      required: false
      default: -1
    - name: ref_boost
      kind: float
      description: "Identity fidelity dial for Picture 2 (multiplies attention to it). 1 = off, 4 = strong likeness (recommended), >10 = over-copying."
      binding: ref_boost@31
      constraints: { min: 0, max: 20 }
      required: false
      default: 4.0
    - name: ref_boost_a
      kind: float
      description: "Same dial for Picture 1. 1 = off; raise it if the pose or room drifts."
      binding: ref_boost_a@31
      constraints: { min: 0, max: 20 }
      required: false
      default: 1.0
    - name: grounding_px
      kind: int
      description: "Longest side of the images the text encoder sees while reading the instruction. Trained range 384-768; lower favors edit adherence, higher likeness."
      binding: grounding_px@40
      constraints: { min: 0, max: 4096 }
      required: false
      default: 768
    - name: identity_strength
      kind: float
      description: "Krea 2 Identity Edit LoRA strength."
      binding: strength_model@14
      constraints: { min: 0, max: 2 }
      required: false
      default: 1.0
  loras:
    - name: lora_1
      kind: lora
      description: "Optional krea2 catalog LoRA slot 1 (e.g. a detail or style LoRA). Stacks after the baked-in LoRAs."
      binding: "15"
      strength: 0.8
      required: false
    - name: lora_2
      kind: lora
      description: "Optional krea2 catalog LoRA slot 2 (e.g. a detail or style LoRA). Stacks after the baked-in LoRAs."
      binding: "15"
      strength: 0.8
      required: false
    - name: lora_3
      kind: lora
      description: "Optional krea2 catalog LoRA slot 3 (e.g. a detail or style LoRA). Stacks after the baked-in LoRAs."
      binding: "15"
      strength: 0.8
      required: false
    - name: lora_4
      kind: lora
      description: "Optional krea2 catalog LoRA slot 4 (e.g. a detail or style LoRA). Stacks after the baked-in LoRAs."
      binding: "15"
      strength: 0.8
      required: false
  outputs:
    - name: edited_image
      kind: image
      description: "The edited Picture 1."
      node_id: "52"
      role: primary
customNodes:
  - name: comfyui-krea2edit
    repository: https://github.com/lbouaraba/comfyui-krea2edit.git
    commitHash: 86f886dac23013d88996e3a2e99093ba44d322fb

context: >
  Krea 2 Identity Edit. Word the instruction with "image 1" / "image 2" and say what to keep from each
  (the room, the lighting and the camera angle of image 1; the exact face, hair and clothing of
  image 2); people stay clothed as in Picture 2 unless the prompt says otherwise. Recipes: (1)
  character into a place: Picture 1 = location plate, Picture 2 = the character design. (2) Swap a
  person in a frame: call this workflow once per person, Picture 1 = the frame (then the previous
  call's output), Picture 2 = ONE character, "Replace the woman in image 1 with the adult woman from
  image 2 ... Leave the man unchanged. Keep the exact poses, camera angle, framing and room of image
  1." Never pass two people as Picture 2 for a swap. Without Picture 2 it edits people and objects;
  global changes (time of day, lighting, camera) barely apply. Frame people large: a wide shot with
  small figures barely takes the identity. ~2 min per image on l40s.

